name: tester
title: "Testing Agent"
role: tester
description: "Designs test plans and executable pytest suites covering edge cases."
capabilities: [testing, testing_design, quality]
tools: [code_lint_py, file_read]
memory:
  individual: true
  shared_access: true
  shared_write: false
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.3}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.3}
  - type: mock
