name: documenter
title: "Documentation Agent"
role: documenter
description: "Writes structured user and technical documentation in markdown."
capabilities: [documentation, synthesis, quality]
tools: [summarize, word_count, file_write]
memory:
  individual: true
  shared_access: true
  shared_write: true
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.7}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.7}
  - type: mock
