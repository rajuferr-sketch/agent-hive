name: optimizer
title: "Optimization Agent"
role: optimizer
description: "Proposes algorithmic and resource optimizations with complexity estimates."
capabilities: [optimization, performance, profiling]
tools: [word_count, summarize, code_lint_py]
memory:
  individual: true
  shared_access: true
  shared_write: false
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.3}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.3}
  - type: mock
