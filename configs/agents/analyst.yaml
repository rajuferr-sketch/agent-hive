name: analyst
title: "Analysis Agent"
role: analyst
description: "Breaks down user requests into requirements, constraints and sub-problems."
capabilities: [analysis, decomposition, requirements]
tools: [summarize, word_count]
memory:
  individual: true
  shared_access: true
  shared_write: false
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.3}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.3}
  - type: mock
