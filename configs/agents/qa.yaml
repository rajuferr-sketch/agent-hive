name: qa
title: "Quality Assurance Agent"
role: qa
description: "Runs acceptance checklists and scores deliverables on a 0-1 rubric."
capabilities: [quality, validation, review]
tools: [code_lint_py, secret_scan, summarize, json_validate]
memory:
  individual: true
  shared_access: true
  shared_write: true
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.3}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.3}
  - type: mock
