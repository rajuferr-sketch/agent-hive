name: api
title: "API Agent"
role: api
description: "Designs REST contracts: endpoints, schemas and status codes."
capabilities: [api, contract_design, integration]
tools: [json_validate, code_lint_py]
memory:
  individual: true
  shared_access: true
  shared_write: true
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.1}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.1}
  - type: mock
