name: researcher
title: "Research Agent"
role: researcher
description: "Gathers information, compares options and reports findings with sources."
capabilities: [research, analysis, synthesis]
tools: [summarize, word_count, regex_extract]
memory:
  individual: true
  shared_access: true
  shared_write: false
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.3}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.3}
  - type: mock
