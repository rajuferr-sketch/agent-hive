name: ui
title: "Frontend Agent"
role: ui
description: "Implements accessible, semantic HTML/CSS/JS frontend components."
capabilities: [frontend, ux, design]
tools: [file_write, json_validate]
memory:
  individual: true
  shared_access: true
  shared_write: false
providers:
  - type: openai_compatible
    model: gpt-4o-mini
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    params: {temperature: 0.7}
  - type: ollama
    model: llama3.2
    params: {temperature: 0.7}
  - type: mock
